<svg width="1500" height="400" viewBox="0 0 1500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1929"/>
      <stop offset="55%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#16324f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d8bfd"/>
      <stop offset="100%" stop-color="#5fa8ff"/>
    </linearGradient>
    <linearGradient id="nameUnderline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d8bfd"/>
      <stop offset="50%" stop-color="#5fa8ff"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1500" height="400" fill="url(#bg)"/>
  <rect width="1500" height="400" fill="url(#grid)"/>

  <!-- Circuit-style decorative lines, right side -->
  <g opacity="0.35" stroke="#5fa8ff" stroke-width="1.5" fill="none">
    <path d="M 1150 60 L 1250 60 L 1250 120 L 1350 120"/>
    <path d="M 1180 340 L 1280 340 L 1280 260 L 1400 260"/>
    <path d="M 1400 60 L 1440 60 L 1440 160"/>
    <circle cx="1250" cy="60" r="4" fill="#5fa8ff"/>
    <circle cx="1350" cy="120" r="4" fill="#5fa8ff"/>
    <circle cx="1280" cy="340" r="4" fill="#5fa8ff"/>
    <circle cx="1400" cy="260" r="4" fill="#5fa8ff"/>
    <circle cx="1440" cy="60" r="4" fill="#5fa8ff"/>
  </g>

  <!-- Name -->
  <text x="90" y="140" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Ryan Charles Neu</text>
  <rect x="90" y="150" width="430" height="4" fill="#5fa8ff"/>

  <!-- Title line -->
  <text x="90" y="200" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#a9c6e8">Mechanical Engineering Student &#183; Villanova University</text>

  <!-- Focus line -->
  <text x="90" y="240" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="300" fill="#7fa8d1">Robotics &#183; Autonomous Systems &#183; Defense &amp; National Security Technology</text>

  <!-- Bottom tags -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500">
    <rect x="90" y="290" width="150" height="34" rx="17" fill="none" stroke="#5fa8ff" stroke-width="1.4"/>
    <text x="165" y="312" fill="#8fb8e8" text-anchor="middle">Autonomy Research</text>

    <rect x="255" y="290" width="150" height="34" rx="17" fill="none" stroke="#5fa8ff" stroke-width="1.4"/>
    <text x="330" y="312" fill="#8fb8e8" text-anchor="middle">Combat Robotics</text>

    <rect x="420" y="290" width="150" height="34" rx="17" fill="none" stroke="#5fa8ff" stroke-width="1.4"/>
    <text x="495" y="312" fill="#8fb8e8" text-anchor="middle">Embedded Systems</text>
  </g>
</svg>
